name: nearby_dual_bridge
description: >
  Cross-platform dual-role nearby bridge for Android, iOS, and macOS.
  Each device can dynamically act as Host or Client over Wi-Fi (mDNS + WebSocket)
  and BLE (Central / Peripheral).
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.7
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  bluetooth_low_energy: ^6.2.1
  nsd: ^5.0.1
  permission_handler: ^13.0.2
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.nearby_dual_bridge
        pluginClass: NearbyDualBridgePlugin
      ios:
        pluginClass: NearbyDualBridgePlugin
      macos:
        pluginClass: NearbyDualBridgePlugin
